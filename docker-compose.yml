version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: certificate-validator:latest
    ports:
      - "80:80"
    environment:
      APP_NAME: "${APP_NAME:-CertificateValidator}"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-certificate_validator}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      CNSM_VERIFICAR_CADENA_CONFIANZA: "${CNSM_VERIFICAR_CADENA_CONFIANZA:-false}"
      CNSM_FIRMA_TIMEOUT: "${CNSM_FIRMA_TIMEOUT:-60}"
    volumes:
      - app-storage:/app/storage
    depends_on:
      - db

  worker:
    image: certificate-validator:latest
    restart: always
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    environment:
      APP_NAME: "${APP_NAME:-CertificateValidator}"
      APP_ENV: production
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-certificate_validator}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      FILESYSTEM_DISK: public
      CNSM_VERIFICAR_CADENA_CONFIANZA: "${CNSM_VERIFICAR_CADENA_CONFIANZA:-false}"
      CNSM_FIRMA_TIMEOUT: "${CNSM_FIRMA_TIMEOUT:-60}"
    volumes:
      - app-storage:/app/storage
    depends_on:
      - db
      - app


  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-certificate_validator}"
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  app-storage:
  db-data:
