name: Build and Deploy to Coolify

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository name for GHCR
        run: |
          echo "IMAGE_NAME_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify Deploy Webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ]; then
            echo "Error: La variable secreta COOLIFY_WEBHOOK no está configurada en GitHub."
            exit 1
          fi

          echo "Disparando el webhook de despliegue en Coolify..."

          # Añadimos force=true para garantizar que Coolify haga pull de la nueva imagen y no use caché local
          if [[ "$COOLIFY_WEBHOOK" == *"?"* ]]; then
            WEBHOOK_URL="${COOLIFY_WEBHOOK}&force=true"
          else
            WEBHOOK_URL="${COOLIFY_WEBHOOK}?force=true"
          fi

          if [ -n "$COOLIFY_TOKEN" ]; then
            curl -sS -X GET "$WEBHOOK_URL" \
              --header "Authorization: Bearer $COOLIFY_TOKEN"
          else
            curl -sS -X GET "$WEBHOOK_URL"
          fi

          echo "Webhook enviado con éxito."
